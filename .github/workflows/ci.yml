name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas pytest matplotlib jupyter nbconvert ipykernel opencv-python-headless imagehash numpy pillow pyyaml tabulate ruff
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps megadetector clipboard dill fastquadtree humanfriendly jsonpickle mkl \
            scikit-learn thop ultralytics-yolov5 seaborn
          pip install mlflow fastapi uvicorn python-multipart

      - name: Lint (unused imports, redefinitions, unused variables)
        run: ruff check --select F401,F811,F841 .

      - name: Test
        run: python -m pytest tests/ -v
